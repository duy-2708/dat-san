; /etc/supervisor/conf.d/dat-san.conf — chạy nền gửi email (hàng đợi). Tự khởi động lại nếu chết.
[program:dat-san-hang-doi]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php THU_MUC/artisan queue:work --sleep=3 --tries=3 --max-time=3600
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=THU_MUC/storage/logs/hang-doi.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
