# /etc/nginx/sites-available/dat-san — cai-may-chu.sh tự thay TEN_MIEN, THU_MUC, PHP_SOCK. Certbot tự thêm khối HTTPS.
limit_req_zone $binary_remote_addr zone=datsan_moi_ip:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name TEN_MIEN www.TEN_MIEN;
    root THU_MUC/public;
    index index.php;

    charset utf-8;
    client_max_body_size 40M;
    server_tokens off;

    # IP thật của khách khi đi qua Cloudflare
    include /etc/nginx/cloudflare-ip.conf;

    # Chống dội request (DDoS nhỏ, bot): tối đa 20 req/giây/IP, cho phép dồn 40
    limit_req zone=datsan_moi_ip burst=40 nodelay;
    limit_req_status 429;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Ảnh, css, js: cache trình duyệt 30 ngày
    location ~* \.(?:jpg|jpeg|png|webp|gif|svg|ico|css|js|woff2?)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:PHP_SOCK;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60;
    }

    # Chặn mọi file ẩn (.env, .git, ...) và file php khác index.php
    location ~ /\.(?!well-known).* { deny all; }
    location ~ \.php$ { return 404; }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
}
